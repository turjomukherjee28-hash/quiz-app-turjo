<!DOCTYPE html>
<index.html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>সাউন্ডসহ এশিয়া কুইজ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #71b7e6, #9b59b6); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #quiz-container { background-color: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; max-width: 500px; text-align: center; }
        .question { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #333; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background-color: #f8f9fa; border: 2px solid #ddd; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 16px; transition: all 0.3s ease; }
        .option-btn:hover { background-color: #e9ecef; border-color: #007bff; }
        .correct { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .wrong { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        .copy-btn { margin-top: 15px; padding: 8px 15px; background-color: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .copy-btn:hover { background-color: #5a6268; }
        #score-container { font-size: 24px; font-weight: bold; color: #333; }
        .next-btn { margin-top: 20px; padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; display: none; }
        .next-btn:hover { background-color: #0056b3; }
        #timer { font-size: 18px; font-weight: bold; color: #dc3545; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="quiz-view">
        <div id="timer">সময় বাকি: 10সেকেন্ড</div>
        <div id="question-container">

            <button class="copy-btn" onclick="copyQuestion()">প্রশ্ন কপি করুন</button>
        </div>
        <div class="options" id="options"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">পরবর্তী প্রশ্ন</button>
    </div>
    <div id="score-container" style="display: none;"></div>
</div>

        return array.sort(() => Math.random() - 0.5);
    }

    let shuffledQuestions = shuffle([...questions]);
    let currentQuestionIndex = 0;
    let score = 10;
    let answered = false;
    let timer;
    let timeLeft = 10;

    function startTimer() {
        timeLeft = 10;
        document.getElementById('timer').innerText = `সময় বাকি: ${timeLeft} সেকেন্ড`;
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `সময় বাকি: ${timeLeft} সেকেন্ড`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                timeOut();
            }
        }, 1000);
    }

    function timeOut() {
        answered = true;
        wrongSound.play();
        const currentQ = shuffledQuestions[currentQuestionIndex];
        const optionsContainer = document.getElementById('options');
        const buttons = optionsContainer.getElementsByTagName('button');

        for (let btn of buttons) {
            if (btn.innerText === currentQ.correct) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
            }
        }
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function loadQuestion() {
        answered = false;
        clearInterval(timer);
        startTimer();
        const currentQ = shuffledQuestions[currentQuestionIndex];
        document.getElementById('question').innerText = currentQ.question;
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';
        
        const shuffledOptions = shuffle([...currentQ.options]);
        shuffledOptions.forEach(option => {
            const btn = document.createElement('button');
            btn.innerText = option;
            btn.className = 'option-btn';
            btn.onclick = () => checkAnswer(btn, option, currentQ.correct);
            optionsContainer.appendChild(btn);
        });
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selectedBtn, selectedOption, correctOption) {
        if (answered) return;
        answered = true;
        clearInterval(timer);

        const optionsContainer = document.getElementById('options');
        const buttons = optionsContainer.getElementsByTagName('button');

        if (selectedOption === correctOption) {
            selectedBtn.classList.add('correct');
            correctSound.play();
            score++;
        } else {
            selectedBtn.classList.add('wrong');
            wrongSound.play();
            for (let btn of buttons) {
                if (btn.innerText === correctOption) {
                    btn.classList.add('correct');
                    break;
                }
            }
        }
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < shuffledQuestions.length) {
            loadQuestion();
        } else {
            document.getElementById('quiz-view').style.display = 'none';
            const scoreContainer = document.getElementById('score-container');
            scoreContainer.style.display = 'block';
            scoreContainer.innerText = `খেলা শেষ! আপনার মোট স্কোর: ${score}/${shuffledQuestions.length}`;
        }
    }

    function copyQuestion() {
        const questionText = document.getElementById('question').innerText;
        navigator.clipboard.writeText(questionText).then(() => {
            alert('প্রশ্নটি কপি করা হয়েছে!');
        });
    }

    document.body.addEventListener('click', () => {
    }, { once: true });

    loadQuestion();
</script>
